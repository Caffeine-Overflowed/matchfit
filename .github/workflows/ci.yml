name: CI

# PR validation gate. Build + deploy on main is owned by deploy.yml;
# per-PR preview envs by preview.yml. This workflow only fails a PR fast
# on lint / build / schema errors — it never deploys.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        # Advisory: reports eslint findings as annotations (incl. generated
        # graphql.ts) without gating the pipeline.
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_URL: https://api.matchfit.coverflow.net
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-dummy-key

  backend-build:
    name: backend · docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-schema:
    name: backend · schema import
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Importing the app builds the Strawberry schema and validates pydantic
    # settings, so this catches resolver-annotation and config errors early.
    env:
      APP__ENV: test
      APP__LOG_LEVEL: WARNING
      DB__USERNAME: app
      DB__PASSWORD: app
      DB__HOST: localhost
      DB__PORT: "5432"
      DB__NAME: app
      DB__POOL_MODE: session
      DB__ECHO: "false"
      AUTH__JWT_SECRET: ci_test_secret_key_that_is_long_enough_1234567890
      AUTH__ACCESS_TTL_SEC: "3600"
      AUTH__REFRESH_TTL_SEC: "604800"
      AUTH__ISSUER: matchfit
      AUTH__REFRESH_TOKEN_BYTES_LEN: "32"
      AUTH__PASSWORD_MIN_LENGTH: "8"
      REDIS__HOST: localhost
      REDIS__PORT: "6379"
      GOOGLE__CLIENT_ID: ci-dummy
      GOOGLE__CLIENT_SECRET: ci-dummy
      GOOGLE__REDIRECT_URI: http://localhost:3000/auth/oauth/google
      MINIO__ENDPOINT: localhost:9000
      MINIO__ACCESS_KEY: ci-dummy
      MINIO__SECRET_KEY: ci-dummy
      MINIO__BUCKET_NAME: matchfit
      MINIO__SECURE: "false"
      MINIO__PUBLIC_URL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen --group migration
      - name: Build GraphQL schema
        run: uv run python -c "from app.graphql.schema import schema; print('schema OK')"
