name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

# Fully automated per-PR previews. Instead of Coolify's (UI-only) preview
# feature, each PR gets its own ephemeral Coolify apps created via the API:
#   backend  -> https://pr-<N>-api.matchfit.coverflow.net  (isolated Neon branch)
#   frontend -> https://pr-<N>.matchfit.coverflow.net      (NEXT_PUBLIC_URL -> the pr api, cross-origin)
# Closing the PR deletes both apps and the Neon branch.
env:
  CO: ${{ secrets.COOLIFY_URL }}/api/v1
  TOKEN: ${{ secrets.COOLIFY_TOKEN }}
  NEON: https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}
  NKEY: ${{ secrets.NEON_API_KEY }}
  PR: ${{ github.event.number }}
  PROJECT: f10ov3qaks6llyfpxuudcmsw
  ENVNAME: production
  SERVER: vw3eqfm6pq384nwwlf7wymbs
  GH_APP: r2ogx6gr3r5nqpy8nc3q5wa0
  REPO: Caffeine-Overflowed/matchfit

jobs:
  deploy:
    if: github.event.action != 'closed'
    name: preview · pr-${{ github.event.number }}
    runs-on: ubuntu-latest
    # No `environment:` on purpose: a per-PR GitHub Environment (pr-N) is NOT
    # deleted on teardown (GITHUB_TOKEN can't manage environments), so it would
    # orphan on every closed PR. The preview URL is printed in the deploy step
    # and posted as a PR comment below instead.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Provision Neon branch + ephemeral Coolify apps
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
        run: |
          set -euo pipefail
          co(){ curl -s -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }
          nn(){ curl -s -H "Authorization: Bearer $NKEY" -H "Content-Type: application/json" "$@"; }

          # --- 1) isolated Neon branch (copied from main -> already migrated) ---
          bid=$(nn "$NEON/branches" | jq -r --arg n "pr-$PR" '.branches[]|select(.name==$n)|.id' | head -1)
          if [ -z "$bid" ] || [ "$bid" = "null" ]; then
            bid=$(nn -X POST "$NEON/branches" -d "{\"branch\":{\"name\":\"pr-$PR\"},\"endpoints\":[{\"type\":\"read_write\"}]}" | jq -r '.branch.id')
          fi
          host=""
          for i in $(seq 1 12); do
            host=$(nn "$NEON/endpoints" | jq -r --arg b "$bid" '.endpoints[]|select(.branch_id==$b)|.host' | head -1)
            [ -n "$host" ] && [ "$host" != "null" ] && break; sleep 5
          done
          POOLED=$(echo "$host" | sed 's/\.c-/-pooler.c-/')
          echo "Neon branch=$bid host=$POOLED"

          find_app(){ co "$CO/applications" | jq -r --arg n "$1" '.[]|select(.name==$n)|.uuid' | head -1; }

          # --- 2) backend preview app ---
          AN="matchfit-api-pr-$PR"
          AU=$(find_app "$AN")
          if [ -z "$AU" ] || [ "$AU" = "null" ]; then
            AU=$(co -X POST "$CO/applications/private-github-app" -d "$(jq -nc \
              --arg p "$PROJECT" --arg s "$SERVER" --arg e "$ENVNAME" --arg g "$GH_APP" --arg r "$REPO" \
              --arg br "$BRANCH" --arg name "$AN" --arg dom "https://pr-$PR-api.matchfit.coverflow.net" \
              '{project_uuid:$p,server_uuid:$s,environment_name:$e,github_app_uuid:$g,git_repository:$r,git_branch:$br,build_pack:"dockerfile",base_directory:"/backend",dockerfile_location:"/Dockerfile",ports_exposes:"8000",name:$name,domains:$dom,instant_deploy:false}')" | jq -r '.uuid')
          fi
          echo "backend app=$AU"
          echo "$BACKEND_ENV_B64" | base64 -d | grep -v '^\s*#' | grep '=' > /tmp/env
          sed -i "s|^DB__HOST=.*|DB__HOST=$POOLED|" /tmp/env
          ENVDATA=$(jq -R -s 'split("\n")|map(select(length>0))|map(split("=")|{key:.[0],value:(.[1:]|join("=")),is_preview:false,is_literal:true})' /tmp/env)
          co -X PATCH "$CO/applications/$AU/envs/bulk" -d "{\"data\":$ENVDATA}" >/dev/null

          # --- 3) frontend preview app ---
          WN="matchfit-web-pr-$PR"
          WU=$(find_app "$WN")
          if [ -z "$WU" ] || [ "$WU" = "null" ]; then
            WU=$(co -X POST "$CO/applications/private-github-app" -d "$(jq -nc \
              --arg p "$PROJECT" --arg s "$SERVER" --arg e "$ENVNAME" --arg g "$GH_APP" --arg r "$REPO" \
              --arg br "$BRANCH" --arg name "$WN" --arg dom "https://pr-$PR.matchfit.coverflow.net" \
              '{project_uuid:$p,server_uuid:$s,environment_name:$e,github_app_uuid:$g,git_repository:$r,git_branch:$br,build_pack:"nixpacks",base_directory:"/frontend",ports_exposes:"3000",name:$name,domains:$dom,instant_deploy:false}')" | jq -r '.uuid')
          fi
          echo "frontend app=$WU"
          co -X PATCH "$CO/applications/$WU/envs/bulk" -d "$(jq -nc \
            --arg u "pr-$PR-api.matchfit.coverflow.net" --arg m "$MAPS_KEY" \
            '{data:[{key:"NEXT_PUBLIC_URL",value:$u,is_build_time:true,is_literal:true},{key:"NEXT_PUBLIC_GOOGLE_MAPS_API_KEY",value:$m,is_build_time:true,is_literal:true}]}')" >/dev/null

          # --- 4) deploy both ---
          echo "deploy backend:"; co -X POST "$CO/deploy?uuid=$AU"; echo
          echo "deploy frontend:"; co -X POST "$CO/deploy?uuid=$WU"; echo
          echo "Preview: https://pr-$PR.matchfit.coverflow.net (api: https://pr-$PR-api.matchfit.coverflow.net)"

      - name: Comment preview URLs on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Preview environment for this PR:
          - Web: https://pr-$PR.matchfit.coverflow.net
          - API: https://pr-$PR-api.matchfit.coverflow.net"
          gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none --body "$body"

  teardown:
    if: github.event.action == 'closed'
    name: preview · teardown pr-${{ github.event.number }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete ephemeral apps + Neon branch
        run: |
          set -uo pipefail
          for n in "matchfit-api-pr-$PR" "matchfit-web-pr-$PR"; do
            u=$(curl -s -H "Authorization: Bearer $TOKEN" "$CO/applications" | jq -r --arg n "$n" '.[]|select(.name==$n)|.uuid' | head -1)
            if [ -n "$u" ] && [ "$u" != "null" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $TOKEN" "$CO/applications/$u?delete_volumes=true&delete_connected_networks=true" >/dev/null
              echo "deleted app $n"
            fi
          done
          bid=$(curl -s -H "Authorization: Bearer $NKEY" "$NEON/branches" | jq -r --arg n "pr-$PR" '.branches[]|select(.name==$n)|.id' | head -1)
          if [ -n "$bid" ] && [ "$bid" != "null" ]; then
            curl -s -X DELETE -H "Authorization: Bearer $NKEY" "$NEON/branches/$bid" >/dev/null
            echo "deleted neon branch $bid"
          fi
