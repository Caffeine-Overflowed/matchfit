name: preview

# Per-PR preview environments for matchfit on the k3s GitOps platform.
#
# opened / synchronize / reopened:
#   1. create (or reset) a Neon branch  preview/pr-<N>  off main
#   2. run Alembic migrations on that branch
#   3. build + push backend + frontend images tagged  pr-<N>-<sha>
#      (frontend baked with NEXT_PUBLIC_URL = preview api host)
#   4. commit apps/matchfit/previews/overlays/pr-<N>/ into the infra repo,
#      carrying the branch DB__HOST. The infra ApplicationSet PR generator
#      already watches open PRs and syncs the env from that overlay.
# closed:
#   5. delete the Neon branch and remove the infra overlay. The ApplicationSet
#      drops the Application (preserveResourcesOnDeletion=false), which prunes
#      the namespace + all resources.
#
# Preview hosts are SINGLE-LEVEL so the *.coverflow.net wildcard cert covers them:
#   frontend -> https://pr-<N>-matchfit.coverflow.net
#   backend  -> https://pr-<N>-api-matchfit.coverflow.net

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/caffeine-overflowed/matchfit-backend
  FRONTEND_IMAGE: ghcr.io/caffeine-overflowed/matchfit-frontend
  PR: ${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha }}
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
  FRONTEND_HOST: pr-${{ github.event.pull_request.number }}-matchfit.coverflow.net
  API_HOST: pr-${{ github.event.pull_request.number }}-api-matchfit.coverflow.net

jobs:
  # ---------------------------------------------------------------- create ---
  neon-branch:
    name: neon · create branch
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      db_host: ${{ steps.branch.outputs.db_host }}
    steps:
      - name: Create Neon branch
        id: create
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent: main
          branch_name: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Derive branch host
        id: branch
        env:
          DB_URL: ${{ steps.create.outputs.db_url }}
        run: |
          # create-branch-action returns a full connection URL; strip to host.
          host=$(printf '%s' "$DB_URL" | sed -E 's#^[^@]+@##; s#[:/].*$##')
          echo "db_host=${host}" >> "$GITHUB_OUTPUT"
          echo "Neon branch host: ${host}"

  # ----------------------------------------------------------------- build ---
  build-backend:
    name: build · backend
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:pr-${{ env.PR }}-${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: build · frontend
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:pr-${{ env.PR }}-${{ env.SHA }}
          # NEXT_PUBLIC_URL is inlined at build time -> must be the PREVIEW api host.
          build-args: |
            NEXT_PUBLIC_URL=https://${{ env.API_HOST }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.MAPS_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------- migrate ---
  migrate:
    name: migrate · neon branch
    if: github.event.action != 'closed'
    needs: [neon-branch, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Alembic migrations on the PR branch
        run: |
          docker run --rm \
            -e APP__ENV=stage \
            -e APP__LOG_LEVEL=INFO \
            -e DB__USERNAME='${{ secrets.PROD_DB_USER }}' \
            -e DB__PASSWORD='${{ secrets.PROD_DB_PASSWORD }}' \
            -e DB__HOST='${{ needs.neon-branch.outputs.db_host }}' \
            -e DB__PORT='5432' \
            -e DB__NAME='${{ secrets.PROD_DB_NAME }}' \
            -e DB__POOL_MODE=transaction \
            -e DB__ECHO=false \
            -e PGSSLMODE=require \
            -e AUTH__JWT_SECRET=migrations_only_placeholder_secret_1234567890 \
            -e AUTH__ACCESS_TTL_SEC=3600 \
            -e AUTH__REFRESH_TTL_SEC=604800 \
            -e AUTH__ISSUER=matchfit \
            -e AUTH__REFRESH_TOKEN_BYTES_LEN=32 \
            -e AUTH__PASSWORD_MIN_LENGTH=8 \
            -e REDIS__HOST=localhost \
            -e REDIS__PORT=6379 \
            -e GOOGLE__CLIENT_ID=unused \
            -e GOOGLE__CLIENT_SECRET=unused \
            -e GOOGLE__REDIRECT_URI=http://localhost/auth/oauth/google \
            -e MINIO__ENDPOINT=localhost:9000 \
            -e MINIO__ACCESS_KEY=unused \
            -e MINIO__SECRET_KEY=unused \
            -e MINIO__BUCKET_NAME=matchfit-media \
            -e MINIO__SECURE=false \
            -e MINIO__PUBLIC_URL='' \
            ${{ env.BACKEND_IMAGE }}:pr-${{ env.PR }}-${{ env.SHA }} \
            uv run migrate upgrade head

  # --------------------------------------------------------------- teardown ---
  teardown:
    name: teardown · neon
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      # The ApplicationSet PR generator drops the preview Application on PR
      # close, pruning its namespace. Only the Neon branch needs explicit
      # teardown here — infra is never touched by this repo.
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
