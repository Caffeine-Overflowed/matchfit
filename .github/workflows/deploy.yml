name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/caffeine-overflowed/matchfit-backend
  FRONTEND_IMAGE: ghcr.io/caffeine-overflowed/matchfit-frontend

jobs:
  build-backend:
    name: build · backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: build · frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_URL=https://api.matchfit.coverflow.net
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.MAPS_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: migrate · neon
    needs: [build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Run Alembic migrations against Neon using the freshly-built backend
      # image. Non-DB settings are required by pydantic at import time but
      # unused by migrations, so valid dummies are fine.
      - name: Run DB migrations (Neon)
        run: |
          docker run --rm \
            -e APP__ENV=prod \
            -e APP__LOG_LEVEL=INFO \
            -e DB__USERNAME='${{ secrets.PROD_DB_USER }}' \
            -e DB__PASSWORD='${{ secrets.PROD_DB_PASSWORD }}' \
            -e DB__HOST='${{ secrets.PROD_DB_HOST }}' \
            -e DB__PORT='5432' \
            -e DB__NAME='${{ secrets.PROD_DB_NAME }}' \
            -e DB__POOL_MODE=transaction \
            -e DB__ECHO=false \
            -e PGSSLMODE=require \
            -e AUTH__JWT_SECRET=migrations_only_placeholder_secret_1234567890 \
            -e AUTH__ACCESS_TTL_SEC=3600 \
            -e AUTH__REFRESH_TTL_SEC=604800 \
            -e AUTH__ISSUER=matchfit \
            -e AUTH__REFRESH_TOKEN_BYTES_LEN=32 \
            -e AUTH__PASSWORD_MIN_LENGTH=8 \
            -e REDIS__HOST=localhost \
            -e REDIS__PORT=6379 \
            -e GOOGLE__CLIENT_ID=unused \
            -e GOOGLE__CLIENT_SECRET=unused \
            -e GOOGLE__REDIRECT_URI=http://localhost/auth/oauth/google \
            -e MINIO__ENDPOINT=localhost:9000 \
            -e MINIO__ACCESS_KEY=unused \
            -e MINIO__SECRET_KEY=unused \
            -e MINIO__BUCKET_NAME=matchfit-media \
            -e MINIO__SECURE=false \
            -e MINIO__PUBLIC_URL='' \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            uv run migrate upgrade head

  bump:
    name: bump · infra gitops
    needs: [build-backend, build-frontend, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: Lander1x/infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Bump image tags
        working-directory: infra/apps/matchfit/prod
        run: |
          kustomize edit set image matchfit-backend-placeholder=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          kustomize edit set image matchfit-frontend-placeholder=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
      - name: Commit and push
        working-directory: infra
        run: |
          git config user.name  "matchfit-ci"
          git config user.email "ci@matchfit.coverflow.net"
          git add apps/matchfit/prod/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "chore(matchfit): bump prod images to ${{ github.sha }}"
          git push origin HEAD:main
