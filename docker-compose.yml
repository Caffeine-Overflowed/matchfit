services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - ./db_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - ./redis_data:/data

  minio:
    image: minio/minio:latest
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  # Creates the bucket and allows anonymous downloads — without this every
  # image GET returns 403 in local dev (the Helm chart has an mc Job for this).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-changeme}; do sleep 1; done;
      mc mb -p local/${MINIO__BUCKET_NAME:-matchfit};
      mc anonymous set download local/${MINIO__BUCKET_NAME:-matchfit};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
